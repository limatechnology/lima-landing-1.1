name: Security Auditing & CI Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  audit-and-build:
    name: Audit & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Audit Dependencies for Vulnerabilities
        run: npm audit --audit-level=high

      - name: Next.js Compile Verification
        run: npm run build
